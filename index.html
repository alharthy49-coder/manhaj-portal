<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منهج الطالبين | البوابة الأكاديمية</title>
    <style>
        body { font-family: 'Sakkal Majalla', 'Traditional Arabic', 'Noto Naskh Arabic', 'Segoe UI', Tahoma, Arial, sans-serif; font-weight: 700; background-color: #f4f7f6; margin: 0; padding: 50px 20px; text-align: center; display: flex; flex-direction: column; min-height: 90vh; }
        .content-wrapper { flex: 1; }
        .header { margin-bottom: 50px; }
        h1 { color: #1a365d; font-size: 40px; margin-bottom: 10px; font-weight: 800; }
        .subtitle { color: #b89221; font-size: 22px; font-weight: 800; margin-top: 0; }
        .container { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; max-width: 1100px; margin: auto; }
        .card { background: white; padding: 34px 28px; border-radius: 14px; box-shadow: 0 4px 14px rgba(15,23,42,0.06); width: 300px; text-decoration: none; color: #333; border-top: 4px solid #1a365d; transition: transform 0.14s ease, border-color 0.14s ease; }
        .card:hover { transform: translateY(-4px); border-top-color: #d4af37; }
        .card-title { font-size: 27px; color: #1a365d; margin-bottom: 12px; font-weight: 800; }
        .card-desc { font-size: 18px; color: #4b5563; line-height: 1.7; font-weight: 700; }
        footer { margin-top: 50px; font-size: 14px; color: #666; border-top: 1px solid #ddd; padding-top: 20px; }
        footer a { color: #1a365d; text-decoration: none; font-weight: bold; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="header">
            <h1>منهج الطالبين</h1>
            <p class="subtitle">علم على بصيرة</p>
        </div>
        <div class="container">
            <a href="advisor/index.html" class="card">
                <div class="card-title">المستشار الأكاديمي</div>
                <div class="card-desc">بوابة التوجيه والإرشاد لتوجيه مسارك الدراسي.</div>
            </a>
            <a href="gpa/index.html" class="card">
                <div class="card-title">حاسبة المعدل التراكمي</div>
                <div class="card-desc">أداة دقيقة لمحاكاة وتقييم الأداء الأكاديمي بفعالية.</div>
            </a>
            <a href="applications/index.html" class="card">
                <div class="card-title">التطبيقات العلمية</div>
                <div class="card-desc">تدريبات تفاعلية مرتبطة بالمقررات والموضوعات الدراسية.</div>
            </a>
        </div>
    </div>
    <footer>
        للاستفسارات والمقترحات: <span dir="ltr" style="unicode-bidi: embed; display: inline-block;">alharthy49@gmail.com</span>
    </footer>
</body>
</html>
